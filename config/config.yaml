# Project Configuration
# From Stage to System: Bias Propagation in Clinical AI Pipelines

active_environment: "kaggle" 
random_seed: 42

environments:
  local:
    mimic_dir: "C:/Users/hilin/Documents/MIMIC-IV"
    notes_dir: "C:/Users/hilin/Documents/MIMIC-IV/note"
    preprocessed_dir: "data/splits"
    output_dir: "data/splits"
  kaggle:
    mimic_dir: "/kaggle/input/mimic-iv"
    notes_dir: "/kaggle/input/datasets/luwammajor/mimic-iv-notes"
    preprocessed_dir: "/kaggle/input/datasets/luwammajor/clinical-pipeline-preprocessed"
    output_dir: "/kaggle/working"

# Input datasets (resolved from preprocessed_dir)
data:
  notes_index: "mimic_notes_index.parquet"
  features:    "mimic_features.parquet"
  train:       "train.parquet"
  val:         "val.parquet"
  test:        "test.parquet"

# Output files (resolved from output_dir)
outputs:
  stage1_output: "stage1_extracted.parquet"
  stage1_eval_sample: "stage1_eval_sample.csv"

split:
  train: 0.70
  val:   0.15
  test:  0.15

protected_attributes:
  single:         ["race", "sex", "insurance"]
  intersectional: ["race_x_sex", "race_x_insurance"]

stage1:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  temperature: 0.0
  max_new_tokens: 512
  sample_size: 4000
  eval_sample_size: 100
  checkpoint_every: 500
  load_in_4bit: true
  do_sample: false
  stratify_on: ["race_clean", "readmitted_30d"]
  sections:
    - "History of Present Illness"
    - "Social History"
    - "Brief Hospital Course"
    - "Discharge Diagnosis"
  max_section_chars: 3000
  extraction_targets: 
    - "comorbidity_flags"
    - "social_determinants"
    - "psychiatric_complexity"
    - "discharge_risk"

stage2:
  target:   "readmitted_30d"
  n_trials: 50
  metric:   "roc_auc"

stage3:
  enrollment_rate: 0.10

fairness:
  lambda_values: [0.1, 0.5, 1.0, 2.0, 5.0]
  n_bootstrap:   1000